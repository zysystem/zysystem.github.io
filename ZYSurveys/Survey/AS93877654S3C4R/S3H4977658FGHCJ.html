<form id="surveyForm">
  <label for="gender">Select gender:</label>
  <select name="gender" id="gender" required>
    <option value="" disabled selected>-- Please select --</option>
    <option value="male">Male</option>
    <option value="Female">Female</option>
    <option value="Secrecy">Confidentiality (number of investigations will be reduced)</option>
  </select>
  <br>

  <label>age</label>
  <select id="age" name="age" required>
    <option value="" disabled selected>-- Please select --</option>
    <option value="Other">Other</option>
    <script>
      for(let i = 8; i <= 100; i++){
        document.write(`<option value="${i}">${i}岁</option>`);
      }
    </script>
  </select>
  <br>

  Please select a province:
  <select name="province" id="province" required>
    <option value="" disabled selected>-- Please select --</option>
    <option value="北京市">Beijing</option>
    <option value="天津市">Tianjin</option>
    <option value="河北省">Hebei</option>
    <option value="山西省">Shanxi</option>
    <option value="内蒙古自治区">Inner Mongolia Autonomous Region</option>
    <option value="辽宁省">Liaoning</option>
    <option value="吉林省">Jilin</option>
    <option value="黑龙江省">Heilongjiang</option>
    <option value="上海市">Shanghai</option>
    <option value="江苏省">Jiangsu</option>
    <option value="浙江省">Zhejiang</option>
    <option value="安徽省">Anhui</option>
    <option value="福建省">Fujian</option>
    <option value="江西省">Jiangxi</option>
    <option value="山东省">Shandong</option>
    <option value="河南省">Henan</option>
    <option value="湖北省">Hubei</option>
    <option value="湖南省">Hunan</option>
    <option value="广东省">Guangdong</option>
    <option value="广西壮族自治区">Guangxi Zhuang Autonomous Region</option>
    <option value="海南省">Hainan</option>
    <option value="重庆市">Chongqing</option>
    <option value="四川省">Sichuan</option>
    <option value="贵州省">Guizhou</option>
    <option value="云南省">Yunnan</option>
    <option value="西藏自治区">Tibet Autonomous Region</option>
    <option value="陕西省">Shaanxi</option>
    <option value="甘肃省">Gansu</option>
    <option value="青海省">Qinghai</option>
    <option value="宁夏回族自治区">Ningxia Hui Autonomous Region</option>
    <option value="新疆维吾尔自治区">Xinjiang Uygur Autonomous Region</option>
  </select>
  <br>

  Birthday:
  <input type="text" id="year" placeholder="Year of birth (4 digits)" required>
  <input type="text" id="month" placeholder="Month of Birth 1 ‑ 12" required>
  <input type="text" id="day" placeholder="Date of Birth 1 ‑ 31" required>
  <br><br>

  <!-- 提交按钮 -->
  <button type="submit">NEXT</button>
</form>

<script>
  const form = document.getElementById('surveyForm');
  const targetUrl = "https://zysystem.github.io/ZYSurveys/surveys/AS93877654S3C4R/X3HD996783CH963";

  form.addEventListener('submit', function(e) {
    // 阻止默认表单提交
    e.preventDefault();
    // 浏览器原生必填校验
    if (!form.checkValidity()) {
      alert("Please fill in all required items!");
      return;
    }
    // 校验通过，跳转页面
    window.location.href = targetUrl;
  });
</script>
