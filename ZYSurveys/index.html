<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ZYSurveys</title>
    <style>
        /* 默认隐藏主页面，只展示限制提示 */
        .main-content {
            display: none;
        }
        .country-limit-text {
            font-size: 26px;
            color: #f33;
            text-align: center;
            margin-top: 120px;
        }
    </style>
</head>
<body>
    <!-- 中国地区访问提示文字 -->
    <div class="country-limit-text" id="limitNotice">
        Unable to access due to country restrictions.
    </div>

    <!-- 正常网站主体内容 -->
    <div class="main-content" id="pageContent">
        <h3>ZYSurveys, a free survey creation tool</h3>
        <h4>Our advantages:</h4>
        <p>1.We support you to customize your survey films</p>
        <button onclick="window.location.href='https://account-zy.netlify.app/login/logintype=ZYSurveys/login'">login</button>
        <button onclick="window.location.href='https://account-zy.netlify.app/login/logintype=ZYSurveys/register.html'">register</button>
    </div>

    <script>
        // 请求IP地理位置接口
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                // CN = 中国大陆地区代码
                if (data.country_code === 'CN') {
                    // 国内：保持提示显示，隐藏页面
                    document.getElementById('limitNotice').style.display = 'block';
                    document.getElementById('pageContent').style.display = 'none';
                } else {
                    // 海外：隐藏限制提示，展示网站
                    document.getElementById('limitNotice').style.display = 'none';
                    document.getElementById('pageContent').style.display = 'block';
                }
            })
            .catch(() => {
                // 接口请求失败（网络/跨域）兜底，直接开放页面
                document.getElementById('limitNotice').style.display = 'none';
                document.getElementById('pageContent').style.display = 'block';
            });
    </script>
</body>
</html>
