<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZYSurveys</title>
    <style>
        .main-content {
            display: none;
        }
        .mask-box {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .tip-card {
            background: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            text-align: center;
        }
        .tip-text {
            font-size: 18px;
            margin-bottom: 20px;
            color: #222;
        }
        button {
            padding: 8px 20px;
            margin: 0 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 地区限制弹窗 -->
    <div class="mask-box" id="limitMask">
        <div class="tip-card">
            <div class="tip-text">This service is not available in China.</div>
            <button id="btnContinue">Continue</button>
            <button id="btnClose">Close</button>
        </div>
    </div>

    <!-- 网站主体 -->
    <div class="main-content" id="pageContent">
        <h3>ZYSurveys, a free survey creation tool</h3>
        <h4>Our advantages:</h4>
        <p>1.We support you to customize your survey films</p>
        <button onclick="window.location.href='https://account-zy.netlify.app/login/logintype=ZYSurveys/login'">login</button>
        <button onclick="window.location.href='https://account-zy.netlify.app/login/logintype=ZYSurveys/register.html'">register</button>
    </div>

    <script>
        const mask = document.getElementById('limitMask');
        const page = document.getElementById('pageContent');
        const btnContinue = document.getElementById('btnContinue');
        const btnClose = document.getElementById('btnClose');

        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                if (data.country_code === 'CN') {
                    // 国内访问：显示弹窗
                    mask.style.display = 'flex';
                } else {
                    // 海外直接展示页面
                    mask.style.display = 'none';
                    page.style.display = 'block';
                }
            })
            .catch(() => {
                // IP接口异常兜底，直接开放页面
                mask.style.display = 'none';
                page.style.display = 'block';
            });

        // 点击Continue，展示网站内容
        btnContinue.onclick = () => {
            mask.style.display = 'none';
            page.style.display = 'block';
        };

        // 点击Close，关闭当前标签页
        btnClose.onclick = () => {
            window.close();
        };
    </script>
</body>
</html>
