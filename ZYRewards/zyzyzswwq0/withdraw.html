<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ZYRewards - 提现</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f5f7fa;display:flex;align-items:center;justify-content:center;height:100vh}
        .box{background:#fff;padding:40px 60px;border-radius:16px;box-shadow:0 4px 20px #00000015;text-align:center}
        .title{font-size:18px;color:#666;margin-bottom:12px}
        .balance{font-size:42px;font-weight:bold;color:#222;margin:10px 0}
        .unit{font-size:16px;color:#888}
        .loading{color:#999}
        .error{color:#f44336}
    </style>
</head>
<body>
    <div class="box">
        <div class="title">你的积分（有延迟）：</div>
        <div class="balance" id="balanceText">加载中...</div>
        <div class="unit">ZYCoins</div>
    </div>

    <script>
        // 远程余额文件地址
        const balanceUrl = "https://zysystem.github.io/ZYRewards/zyzyzswwq0/Balance.txt";
        const balanceDom = document.getElementById("balanceText");

        // 获取余额
        async function getBalance() {
            try {
                const res = await fetch(balanceUrl);
                if (!res.ok) throw new Error("文件获取失败");
                // 读取文本并去除首尾空格换行
                let numStr = await res.text();
                let balance = parseFloat(numStr.trim());

                if (isNaN(balance)) {
                    balanceDom.innerText = "余额数据异常";
                    balanceDom.className = "balance error";
                    return;
                }
                // 格式化金额保留2位小数
                balanceDom.innerText = balance.toFixed(2);
            } catch (err) {
                balanceDom.innerText = "网络加载失败";
                balanceDom.className = "balance error";
                console.error("获取余额错误：", err);
            }
        }
        // 页面加载执行
        getBalance();
    </script>
<input type="radio" name="gender" value="man" id="man">
<label for="man">男</label>

<input type="radio" name="gender" value="woman" id="woman">
<label for="woman">女</label>
</body>
</html>
