<script>
// 获取URL参数
function getUrlParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

// 移除url中的查询参数（刷新后提示消失）
function clearUrlParam() {
  const url = new URL(window.location);
  url.searchParams.delete("Message");
  history.replaceState({}, document.title, url.toString());
}

// 加载Balance.html内容到页面
async function loadBalancePage() {
  const container = document.getElementById("balanceContent");
  try {
    const res = await fetch("https://zysystem.github.io/ZYRewards/zyzyzswwq0/Balance.txt");
    const html = await res.text();
    container.innerHTML = html;
  } catch(err) {
    container.innerHTML = "<p>加载失败</p>";
    console.error(err);
  }
}

// 页面加载完成后执行
window.addEventListener("DOMContentLoaded", function(){
  loadBalancePage();
  const msg = getUrlParam("Message");
  if(msg){
    const alertBox = document.getElementById("msgAlert");
    alertBox.innerText = msg;
    alertBox.style.display = "block";
    // 清理地址栏?Message参数，刷新页面就没有提示了
    clearUrlParam();
  }
});

function openNewTab() {
  const url = "https://zysystem.github.io/ZYRewards/zyzyzswwq0/ZYLabs.html";
  window.open(url, "_blank");
}
