<script>
async function loadBalancePage() {
  const container = document.getElementById("balanceContent");
  try {
    const res = await fetch("https://zysystem.github.io/ZYRewards/zyzyzswwq0/Balance.txt");
    const html = await res.text();
    container.innerHTML = html;
  } catch(err) {
    container.innerHTML = "<p>加载失败</p>";
    console.error(err);
  }
}
window.addEventListener("DOMContentLoaded", loadBalancePage);
</script>
